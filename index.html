<script>
    // Cấu hình Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBrLE0e4xfI5f7Ocuxyj4ls0417sY-vKJQ",
      authDomain: "nhomcaulong-18339.firebaseapp.com",
      projectId: "nhomcaulong-18339",
      storageBucket: "nhomcaulong-18339.firebasestorage.app",
      messagingSenderId: "512401510912",
      appId: "1:512401510912:web:4aa6467b4824b05326bee5",
      measurementId: "G-HNLKEFDPTF"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();
    const dbRef = database.ref('Nhóm Cầu Lông_data');

    // Mặc định luôn có 3 người này nếu database trống
    let playerNames = ["Người chơi 1", "Người chơi 2", "Người chơi 3"];
    let matches = [];
    let players = {};

    function enterApp() {
        document.getElementById('welcomeScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
    }

    // LẮNG NGHE DỮ LIỆU TỪ FIREBASE (CÓ BÁO LỖI NẾU BỊ CHẶN)
    dbRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            // Nếu có dữ liệu người chơi trên Firebase thì lấy, không thì giữ nguyên 3 người mặc định
            if (data.players && data.players.length > 0) {
                playerNames = data.players;
            }
            if (data.matches) {
                matches = data.matches;
            } else {
                matches = []; // Đảm bảo list trận không bị lỗi
            }
        } else {
            // Nếu database trống không, đẩy 3 người mặc định lên luôn
            saveData();
        }
        updateUI(); 
    }, (error) => {
        alert("Lỗi không thể kết nối Firebase! Hãy kiểm tra lại tab 'Rules' trên Firebase. Chi tiết: " + error.message);
    });

    // HÀM LƯU DỮ LIỆU (CÓ CẢNH BÁO NẾU LƯU THẤT BẠI)
    function saveData() {
        dbRef.set({
            players: playerNames,
            matches: matches
        }).catch((error) => {
            alert("Lỗi không thể lưu dữ liệu! Vui lòng làm theo Bước 1 để mở quyền (Rules) Firebase. Chi tiết: " + error.message);
        });
    }

    function calculateStats() {
        players = {};
        playerNames.forEach(name => { players[name] = { name: name, matches: 0, wins: 0, losses: 0, pointsDiff: 0 }; });
        matches.forEach(m => {
            [m.t1p1, m.t1p2].forEach(p => {
                if (players[p]) {
                    players[p].matches += 1; players[p].pointsDiff += (m.score1 - m.score2);
                    if (m.score1 > m.score2) players[p].wins += 1; else if (m.score2 > m.score1) players[p].losses += 1;
                }
            });
            [m.t2p1, m.t2p2].forEach(p => {
                if (players[p]) {
                    players[p].matches += 1; players[p].pointsDiff += (m.score2 - m.score1);
                    if (m.score2 > m.score1) players[p].wins += 1; else if (m.score1 > m.score2) players[p].losses += 1;
                }
            });
        });
    }

    function addPlayer() {
        let newName = prompt("Nhập tên người chơi mới:");
        if (newName && newName.trim() !== "") {
            let trimmedName = newName.trim();
            if (playerNames.includes(trimmedName)) {
                alert("Tên này đã tồn tại rồi!");
            } else { 
                playerNames.push(trimmedName); 
                saveData(); 
            }
        }
    }

    function editPlayerName(oldName) {
        let newName = prompt("Đổi tên cho: " + oldName + "\nNhập tên mới:", oldName);
        if (newName && newName.trim() !== "" && newName !== oldName) {
            let trimmedName = newName.trim();
            if (playerNames.includes(trimmedName)) return alert("Tên này đã tồn tại!");
            let index = playerNames.indexOf(oldName);
            if (index !== -1) playerNames[index] = trimmedName;
            
            matches.forEach(m => {
                if (m.t1p1 === oldName) m.t1p1 = trimmedName; 
                if (m.t1p2 === oldName) m.t1p2 = trimmedName;
                if (m.t2p1 === oldName) m.t2p1 = trimmedName; 
                if (m.t2p2 === oldName) m.t2p2 = trimmedName;
            });
            saveData(); 
        }
    }

    // (Giữ nguyên các hàm addMatch, editMatch, deleteMatch như cũ)
    function addMatch() {
        const date = document.getElementById('matchDate').value;
        const t1p1 = document.getElementById('t1p1').value, t1p2 = document.getElementById('t1p2').value;
        const t2p1 = document.getElementById('t2p1').value, t2p2 = document.getElementById('t2p2').value;
        const score1 = parseInt(document.getElementById('score1').value), score2 = parseInt(document.getElementById('score2').value);
        
        if (new Set([t1p1, t1p2, t2p1, t2p2]).size < 4) return alert("Vui lòng chọn 4 người chơi KHÁC NHAU!");
        if (isNaN(score1) || isNaN(score2)) return alert("Vui lòng nhập tỷ số hợp lệ!");

        matches.push({ id: Date.now().toString(), date, t1p1, t1p2, t2p1, t2p2, score1, score2 });
        document.getElementById('score1').value = ""; document.getElementById('score2').value = ""; 
        saveData(); 
    }

    function editMatch(matchId) {
        let matchIndex = matches.findIndex(m => m.id === matchId);
        if (matchIndex === -1) return;
        let m = matches[matchIndex];
        let newScore1 = prompt(`Điểm mới Đội 1 (${m.t1p1} & ${m.t1p2}):`, m.score1); if (newScore1 === null) return;
        let newScore2 = prompt(`Điểm mới Đội 2 (${m.t2p1} & ${m.t2p2}):`, m.score2); if (newScore2 === null) return;
        if (!isNaN(parseInt(newScore1)) && !isNaN(parseInt(newScore2))) {
            matches[matchIndex].score1 = parseInt(newScore1); matches[matchIndex].score2 = parseInt(newScore2);
            saveData(); 
        }
    }

    function deleteMatch(matchId) {
        if (confirm("Xóa trận đấu này khỏi lịch sử?")) {
            matches = matches.filter(m => m.id !== matchId); saveData(); 
        }
    }

    function updateUI() {
        calculateStats();
        const selects = ['t1p1', 't1p2', 't2p1', 't2p2'].map(id => document.getElementById(id));
        let currSelections = selects.map(sel => sel.value);
        let optionsHTML = playerNames.map(name => `<option value="${name}">${name}</option>`).join("");
        
        selects.forEach((sel, idx) => {
            sel.innerHTML = optionsHTML;
            sel.value = playerNames.includes(currSelections[idx]) ? currSelections[idx] : playerNames[idx % playerNames.length];
        });
        
        if (!document.getElementById('matchDate').value) document.getElementById('matchDate').valueAsDate = new Date();

        // 1. CẬP NHẬT BẢNG XẾP HẠNG
        let playersArray = Object.values(players).sort((a, b) => b.wins !== a.wins ? b.wins - a.wins : b.pointsDiff - a.pointsDiff);
        const tbody = document.getElementById('leaderboard'); 
        tbody.innerHTML = ""; 
        
        // Vẽ danh sách người chơi (mặc định sẽ là 3 người)
        playersArray.forEach((p, index) => {
            tbody.innerHTML += `<tr>
                <td><strong>${index + 1}</strong></td>
                <td class="editable-name" onclick="editPlayerName('${p.name}')">${p.name} ✏️</td>
                <td>${p.matches}</td>
                <td>${p.wins}</td>
                <td>${p.losses}</td>
                <td>${p.pointsDiff > 0 ? "+" + p.pointsDiff : p.pointsDiff}</td>
            </tr>`;
        });

        // 2. CẬP NHẬT LỊCH SỬ
        const historyList = document.getElementById('historyList'); 
        historyList.innerHTML = ""; 
        [...matches].sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(m => {
            let d = new Date(m.date);
            historyList.innerHTML += `<li class="match-item">
                <div style="font-size:0.9em;color:#7f8c8d;margin-bottom:4px;">📅 Ngày: ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}</div>
                <div><span style="color:#2980b9;font-weight:bold;">${m.t1p1} & ${m.t1p2}</span> <span style="margin:0 10px;font-size:1.2em;"><strong>${m.score1} - ${m.score2}</strong></span> <span style="color:#e67e22;font-weight:bold;">${m.t2p1} & ${m.t2p2}</span></div>
                <div class="match-actions">
                    <button class="btn-sm btn-edit" onclick="editMatch('${m.id}')">✏️ Sửa</button>
                    <button class="btn-sm btn-delete-match" onclick="deleteMatch('${m.id}')">❌ Xóa</button>
                </div>
            </li>`;
        });
    }
</script>
